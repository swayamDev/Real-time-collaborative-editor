services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: brahma
      POSTGRES_PASSWORD: brahma
      POSTGRES_DB: brahma
    ports:
      - "5432:5432"
    volumes:
      - brahma-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brahma"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  brahma-postgres:
