name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, unit and Worker tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # Durable Object tests run inside the Workers runtime (workerd).
      - run: pnpm test:sync

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: brahma
          POSTGRES_PASSWORD: brahma
          POSTGRES_DB: brahma
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brahma"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://brahma:brahma@localhost:5432/brahma
      DATABASE_URL_UNPOOLED: postgres://brahma:brahma@localhost:5432/brahma
      # Must match e2e/sync-server.ts. NEXT_PUBLIC_SYNC_URL is baked in at build time.
      NEXT_PUBLIC_SYNC_URL: ws://localhost:8788
      SYNC_INTERNAL_URL: http://localhost:8788
      SYNC_INTERNAL_SECRET: e2e-secret
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm check:bundles
      # Playwright global setup starts the sync Worker with wrangler dev.
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
