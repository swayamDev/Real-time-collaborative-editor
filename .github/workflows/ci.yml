name: CI

# pull_request (never pull_request_target): runs from forks get no secrets
# and a read-only token. Nothing here uses the production environment.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, unit and Worker tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # Durable Object tests run inside the Workers runtime (workerd).
      - run: pnpm test:sync

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: brahma
          POSTGRES_PASSWORD: brahma
          POSTGRES_DB: brahma
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brahma"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://brahma:brahma@localhost:5432/brahma
      DATABASE_URL_UNPOOLED: postgres://brahma:brahma@localhost:5432/brahma
      # Must match e2e/sync-server.ts. NEXT_PUBLIC_SYNC_URL is baked in at build time.
      NEXT_PUBLIC_SYNC_URL: ws://localhost:8788
      # Test-only hooks (pretending to be an older bundle); compiled out of
      # every build without it.
      NEXT_PUBLIC_E2E_HOOKS: "1"
      SYNC_INTERNAL_URL: http://localhost:8788
      # Not a secret: a fixed value for the throwaway local Worker, shared
      # with e2e/sync-server.ts. Production preflight refuses short values.
      SYNC_INTERNAL_SECRET: e2e-secret
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A fresh auth secret for this run only, for the integration tests and
      # the build. Playwright generates its own for the web server and Worker
      # (e2e/auth-env.ts). Nothing here is stored or reused.
      - name: Generate per-run secrets
        run: |
          secret="$(openssl rand -base64 32)"
          echo "::add-mask::$secret"
          echo "BETTER_AUTH_SECRET=$secret" >> "$GITHUB_ENV"
      - run: pnpm db:migrate
      # Server actions and authorization against the Postgres service.
      - run: pnpm test:integration
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm check:bundles
      # Playwright global setup starts the sync Worker with wrangler dev.
      - run: pnpm test:e2e
      # A test that failed and passed on retry still leaves the job green.
      # Its retry keeps a trace (playwright.config.ts) in a "-retry" folder,
      # so upload the report then too, not only when the job fails.
      - name: Check for retried tests
        id: retries
        if: always()
        run: |
          if compgen -G "test-results/*-retry*" > /dev/null; then
            echo "retried=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Retried tests::Some tests failed and were retried; the report and traces are uploaded."
          fi
      - uses: actions/upload-artifact@v7
        if: failure() || steps.retries.outputs.retried == 'true'
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
